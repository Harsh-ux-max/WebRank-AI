<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | WebRank AI</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="Css/theme.css">
  <link rel="stylesheet" href="Css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;

      background: radial-gradient(circle, #38bdf8, transparent 60%);

      filter: blur(120px);
      opacity: 0.15;

      top: -150px;
      right: -150px;

      z-index: -1;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 130%;
      max-width: 600px;
      margin-top: 90px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 60px rgba(56, 189, 248, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #38bdf8;
    }

    .logo p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      transition: 0.3s;
    }

    .form-group input:focus {
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .remember {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.9rem;
    }

    .remember a {
      color: #38bdf8;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.25);
      opacity: 0.9;
    }

    .divider {
      position: relative;
      text-align: center;
      margin: 25px 0;
    }

    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span {
      background: #16233b;
      padding: 0 15px;
      position: relative;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #94a3b8;
    }

    .signup-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    /* Navbar */
    .navbar {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar a:hover {
      color: #38bdf8;
    }

    /* footer */
    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
  <link rel="stylesheet" href="Css/app.css">
  <link rel="stylesheet" href="Css/auth-theme.css">
</head>

<body>
  <nav class="navbar">
    <h2 class="logo">WebRank AI</h2>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about-us.html">About Us</a></li>
      <li><a href="contact-us.html">Contact Us</a></li>
    </ul>
  </nav>
  <div class="page">
    <div class="login-container">
      <div class="login-card">
        <div class="logo">
          <h1>🚀 WebRank AI</h1>
          <p>Welcome back 👋</p>
        </div>

        <form onsubmit="login(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>

          <div class="remember">
            <label>
              <input type="checkbox" />
              Remember Me
            </label>

            <a href="forgot-password.html">Forgot Password?</a>
          </div>

          <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider">
          <span>OR</span>
        </div>

        <button type="button" class="google-btn" onclick="startGoogleLogin()">Continue with Google</button>

        <div class="signup-link">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </div>
    <footer class="footer">
      © 2026 WebRank AI | Developed by Harsh Dhoble
    </footer>
  </div>
  <script src="js/api.js"></script>
  <script src="js/google-config.js"></script>
  <script src="js/google-auth.js"></script>
  <script>
    async function login(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const response = await apiFetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {

          // Save JWT Token
          localStorage.setItem("token", data.token);

          localStorage.setItem("user", JSON.stringify(data.user || {}));

          showToast("Login successful", "success");

          window.location.href =
            data.user?.role === "admin" ? "admin.html" : "dashboard.html";

        } else {

          showToast(data.message || "Login failed", "error");

        }

      } catch (err) {

        console.error(err);

        showToast(err.message || "Login failed", "error");

      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="js/toast.js?v=2"></script>
</body>

</html>
