<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Forgot Password | WebRank AI</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="Css/theme.css">
  <link rel="stylesheet" href="Css/app.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        #38bdf8,
        transparent 60%
      );
      filter: blur(120px);
      opacity: 0.15;
      top: -150px;
      right: -150px;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 60px rgba(56, 189, 248, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .logo p {
      color: #94a3b8;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #334155;
      outline: none;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow:
        0 0 15px rgba(56, 189, 248, 0.25);
    }

    input::placeholder {
      color: #94a3b8;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 15px 30px rgba(56, 189, 248, 0.25);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      line-height: 1.5;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .back {
      text-align: center;
      margin-top: 25px;
    }

    .back a {
      color: #38bdf8;
      text-decoration: none;
    }

    .back a:hover {
      text-decoration: underline;
    }
  </style>

  <link rel="stylesheet" href="Css/app.css">
  <link rel="stylesheet" href="Css/auth-theme.css">
</head>

<body>

  <div class="container">

<div class="card">

  <div class="logo">
    <h1>🔐 WebRank AI</h1>
    <p>
      Forgot your password?
      Enter your email address and we'll help you reset it.
    </p>
  </div>

  <form id="forgotForm">

    <div class="form-group">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      />

    </div>

    <button
      type="submit"
      class="btn"
      id="submitBtn"
    >
      Send Reset Link
    </button>

  </form>

  <div
    id="message"
    class="message"
    role="alert"
  ></div>

  <div class="back">
    <a href="login.html">
      ← Back to Login
    </a>
  </div>

</div>


  </div>

  <script src="js/api.js"></script>

  <script>
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;
    }

    function showDevelopmentResetLink(resetUrl) {
      if (!resetUrl || window.location.hostname === "file:") return;

      const link = document.createElement("a");
      link.href = resetUrl;
      link.textContent = "Open reset page";
      link.target = "_self";
      link.rel = "noopener";
      link.style.display = "block";
      link.style.marginTop = "10px";
      message.appendChild(link);
    }

    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Please enter your email address.",
          "error"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      try {

        const response = await apiFetch(
          "/api/auth/forgot-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            "Unable to process your request."
          );
        }

        showMessage(
          data.message ||
          "If an account exists with this email, a password reset link has been generated.",
          "success"
        );

        showDevelopmentResetLink(data.resetUrl);

        emailInput.value = "";

      } catch (error) {

        console.error(
          "FORGOT PASSWORD ERROR:",
          error
        );

        showMessage(
          error.message ||
          "Unable to connect to the server.",
          "error"
        );

      } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";

      }

    });
  </script>

</body>

</html>
