<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | WebRank AI</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="Css/theme.css">
  <link rel="stylesheet" href="Css/app.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;

      background: radial-gradient(circle, #38bdf8, transparent 60%);

      filter: blur(120px);
      opacity: 0.15;

      top: -150px;
      right: -150px;

      z-index: -1;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 110px 16px 20px;
    }

    .signup-container {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .signup-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: clamp(24px, 5vw, 40px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 60px rgba(56, 189, 248, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #38bdf8;
    }

    .logo p {
      color: #94a3b8;
      margin-top: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      transition: 0.3s;
    }

    .form-group input:focus {
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .signup-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(56, 189, 248, 0.25);
      opacity: 0.9;
    }

    .divider {
      position: relative;
      text-align: center;
      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: white;
      border-radius: 12px;
      cursor: pointer;
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #94a3b8;
    }

    .login-link a {
      color: #38bdf8;
      text-decoration: none;
    }

    .terms {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .terms input {
      margin-right: 8px;
    }

    /* Navbar */
    .navbar {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar a:hover {
      color: #38bdf8;
    }

    /* footer */
    .footer {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 600px) {
      .page {
        padding: 105px 12px 16px;
      }

      .signup-card {
        border-radius: 16px;
      }

      .navbar {
        top: 18px;
        width: calc(100% - 24px);
      }

      .navbar ul {
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .navbar a {
        font-size: 12px;
      }

      .footer {
        font-size: 12px;
        padding: 16px 8px;
      }
    }
  </style>
  <link rel="stylesheet" href="Css/app.css">
  <link rel="stylesheet" href="Css/auth-theme.css">
</head>

<body>
  <nav class="navbar">
    <h2 class="logo">WebRank AI</h2>

    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="about-us.html">About Us</a></li>
      <li><a href="contact-us.html">Contact Us</a></li>
    </ul>
  </nav>
  <div class="page">
    <div class="signup-container">
      <div class="signup-card">
        <div class="logo">
          <h1>WebRank AI</h1>
          <p>Create your account </p>
        </div>

        <form onsubmit="signup(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required />
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" required />
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
          </div>

          <div class="terms">
            <label>
              <input type="checkbox" required />
              I agree to the Terms & Conditions
            </label>
          </div>

          <button class="signup-btn" type="submit">Create Account</button>
        </form>

        <div class="divider">OR</div>

        <button type="button" class="google-btn" onclick="startGoogleLogin()">Continue with Google</button>

        <div class="login-link">
          Already have an account?
          <a href="login.html">Login</a>
        </div>
      </div>
    </div>
    <div>
      <footer class="footer">© 2026 WebRank AI • Secure Login Portal</footer>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/google-config.js"></script>
  <script src="js/google-auth.js"></script>
  <script>
   async function signup(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!name || !email || !password || !confirmPassword) {
    showToast("Please fill all fields", "error");
    return;
  }

  if (password.length < 6) {
    showToast("Password must be at least 6 characters", "error");
    return;
  }

  if (password !== confirmPassword) {
    showToast("Passwords do not match", "error");
    return;
  }

  try {
    const response = await apiFetch("/api/auth/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        email,
        password
      })
    });

    const data = await response.json();

    if (response.ok) {
      showToast("Account created successfully", "success");
      window.location.href = "login.html";
    } else {
      showToast(data.message || "Signup failed", "error");
    }

  } catch (error) {
    console.error(error);
    showToast("Unable to connect to the server", "error");
  }
}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="js/toast.js?v=2"></script>
</body>

</html>
